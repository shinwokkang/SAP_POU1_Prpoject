<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="빠른 시작: git clone, npm install, npm start">
<style>
  text{font-family:'JetBrains Mono','D2Coding','Cascadia Code','Consolas','Menlo',monospace;font-size:16px}
  @keyframes v0{0%,3.333%{opacity:0;transform:translateY(0px)}3.417%,100%{opacity:1;transform:none}}@keyframes w0{0%,5%{transform:translateX(0);animation-timing-function:steps(62,end)}21.667%,100%{transform:translateX(595.2px)}}@keyframes k0{0%,3.333%{opacity:0}3.417%,25%{opacity:1}25.083%,100%{opacity:0}}
  @keyframes v1{0%,25%{opacity:0;transform:translateY(0px)}25.083%,100%{opacity:1;transform:none}}@keyframes w1{0%,26.667%{transform:translateX(0);animation-timing-function:steps(20,end)}32.5%,100%{transform:translateX(192px)}}@keyframes k1{0%,25%{opacity:0}25.083%,35.833%{opacity:1}35.917%,100%{opacity:0}}
  @keyframes v2{0%,35.833%{opacity:0;transform:translateY(0px)}35.917%,100%{opacity:1;transform:none}}@keyframes w2{0%,37.5%{transform:translateX(0);animation-timing-function:steps(11,end)}42.5%,100%{transform:translateX(105.6px)}}@keyframes k2{0%,35.833%{opacity:0}35.917%,46.667%{opacity:1}46.75%,100%{opacity:0}}
  @keyframes v3{0%,46.667%{opacity:0;transform:translateY(0px)}46.75%,100%{opacity:1;transform:none}}@keyframes w3{0%,48.333%{transform:translateX(0);animation-timing-function:steps(9,end)}52.5%,100%{transform:translateX(86.4px)}}@keyframes k3{0%,46.667%{opacity:0}46.75%,58.333%{opacity:1}58.417%,100%{opacity:0}}
  @keyframes v4{0%,58.333%{opacity:0;transform:translateY(6px)}61.667%,100%{opacity:1;transform:none}}
  @keyframes v5{0%,63.333%{opacity:0;transform:translateY(6px)}66.667%,100%{opacity:1;transform:none}}
  @keyframes v6{0%,70%{opacity:0;transform:translateY(0px)}70.083%,100%{opacity:1;transform:none}}@keyframes w6{0%,70%{transform:translateX(0);animation-timing-function:steps(1,end)}70%,100%{transform:translateX(0px)}}@keyframes k6{0%,70%{opacity:0}70.083%,95%{opacity:1}95.083%,100%{opacity:1}}
  @keyframes all{0%,93%{opacity:1}98%,100%{opacity:0}}
  .all{animation:all 12s infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .blink{animation:blink 1s steps(1) infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media (prefers-reduced-motion: reduce){.ln{opacity:1!important}.cov{display:none}}
</style>
<rect x=".5" y=".5" width="959" height="329" rx="16" fill="#0d1117" stroke="#30363d"/>
<path d="M.5 42 V16.5 Q.5 .5 16.5 .5 H943.5 Q959.5 .5 959.5 16.5 V42 Z" fill="#161b22"/>
<line x1="0" y1="42" x2="960" y2="42" stroke="#30363d"/>
<circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
<text x="480" y="26" text-anchor="middle" style="font-size:13px" fill="#8b949e">Terminal — CafeFlow Quick Start</text>
<clipPath id="term"><rect x="2" y="43" width="956" height="285" rx="14"/></clipPath>
<g class="all" clip-path="url(#term)">
<g class="ln" style="opacity:0;animation:v0 12s infinite">
  <text x="30" y="86" fill="#3fb950" font-weight="700">$</text>
  <text x="49.2" y="86" fill="#e6edf3" textLength="595.2" lengthAdjust="spacingAndGlyphs">git clone https://github.com/shinwokkang/SAP_POU1_Prpoject.git</text>
  <g class="cov" style="animation:w0 12s infinite"><rect x="49.2" y="66" width="900.8" height="28" fill="#0d1117"/>
  <g style="animation:k0 12s infinite"><rect class="blink" x="49.2" y="71" width="9.6" height="19" fill="#e6edf3"/></g></g></g>
<g class="ln" style="opacity:0;animation:v1 12s infinite">
  <text x="30" y="120" fill="#3fb950" font-weight="700">$</text>
  <text x="49.2" y="120" fill="#e6edf3" textLength="192" lengthAdjust="spacingAndGlyphs">cd SAP_POU1_Prpoject</text>
  <g class="cov" style="animation:w1 12s infinite"><rect x="49.2" y="100" width="900.8" height="28" fill="#0d1117"/>
  <g style="animation:k1 12s infinite"><rect class="blink" x="49.2" y="105" width="9.6" height="19" fill="#e6edf3"/></g></g></g>
<g class="ln" style="opacity:0;animation:v2 12s infinite">
  <text x="30" y="154" fill="#3fb950" font-weight="700">$</text>
  <text x="49.2" y="154" fill="#e6edf3" textLength="105.6" lengthAdjust="spacingAndGlyphs">npm install</text>
  <g class="cov" style="animation:w2 12s infinite"><rect x="49.2" y="134" width="900.8" height="28" fill="#0d1117"/>
  <g style="animation:k2 12s infinite"><rect class="blink" x="49.2" y="139" width="9.6" height="19" fill="#e6edf3"/></g></g></g>
<g class="ln" style="opacity:0;animation:v3 12s infinite">
  <text x="30" y="188" fill="#3fb950" font-weight="700">$</text>
  <text x="49.2" y="188" fill="#e6edf3" textLength="86.4" lengthAdjust="spacingAndGlyphs">npm start</text>
  <g class="cov" style="animation:w3 12s infinite"><rect x="49.2" y="168" width="900.8" height="28" fill="#0d1117"/>
  <g style="animation:k3 12s infinite"><rect class="blink" x="49.2" y="173" width="9.6" height="19" fill="#e6edf3"/></g></g></g>
<text class="ln" style="opacity:0;animation:v4 12s infinite" x="30" y="222" fill="#8b949e"># → 브라우저에서 test/flp.html#app-preview 가 자동으로 열립니다</text>
<text class="ln" style="opacity:0;animation:v5 12s infinite" x="30" y="256" fill="#8b949e"># → 로컬 UI5 리소스로 실행하려면  npm run start-local</text>
<g class="ln" style="opacity:0;animation:v6 12s infinite">
  <text x="30" y="290" fill="#3fb950" font-weight="700">$</text>
  
  <g class="cov" style="animation:w6 12s infinite"><rect x="49.2" y="270" width="900.8" height="28" fill="#0d1117"/>
  <g style="animation:k6 12s infinite"><rect class="blink" x="49.2" y="275" width="9.6" height="19" fill="#e6edf3"/></g></g></g>
</g>
