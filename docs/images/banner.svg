<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">CafeFlow</title><desc id="d">카페 프랜차이즈 통합 운영 관리 시스템 — SAP Fiori · SAPUI5</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b0f0a"/><stop offset=".55" stop-color="#2e1b12"/><stop offset="1" stop-color="#0b2b4d"/>
  </linearGradient>
  <radialGradient id="gBlue" cx="88%" cy="10%" r="60%"><stop offset="0" stop-color="#1e88e5" stop-opacity=".42"/><stop offset="1" stop-color="#1e88e5" stop-opacity="0"/></radialGradient>
  <radialGradient id="gWarm" cx="10%" cy="95%" r="55%"><stop offset="0" stop-color="#d08a4f" stop-opacity=".34"/><stop offset="1" stop-color="#d08a4f" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".06"/></pattern>
  <linearGradient id="cupG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#e6d1ba"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-400 0;1000 0;1000 0" keyTimes="0;.55;1" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe9cf"/><stop offset=".6" stop-color="#f3cfa6"/><stop offset="1" stop-color="#9ccbff"/></linearGradient>
  <clipPath id="cupClip"><path d="M150 196 H330 V236 C330 292 294 328 240 328 C186 328 150 292 150 236 Z"/></clipPath>
  <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<style>
  text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif}
  @keyframes steam{0%{opacity:0;transform:translateY(16px) scaleY(.85)}35%{opacity:.8}100%{opacity:0;transform:translateY(-30px) scaleY(1.05)}}
  .steam path{transform-box:fill-box;transform-origin:50% 100%;animation:steam 3.6s ease-in-out infinite;opacity:0}
  .steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.2s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .float{animation:float 6s ease-in-out infinite}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .fu{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.9,.2,1) both}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.9)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .fill{transform-box:fill-box;transform-origin:0 50%;animation:fill 1.6s .8s cubic-bezier(.2,.9,.2,1) both}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-640px)}}
  .wave{animation:wave 12s linear infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#gBlue)"/>
  <rect width="1280" height="420" rx="28" fill="url(#gWarm)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)"/>
  <circle cx="1180" cy="40" r="150" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
  <circle cx="1180" cy="40" r="210" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="2"/>
  <path class="wave" d="M0 392 Q160 372 320 392 T640 392 T960 392 T1280 392 T1600 392 T1920 392 V420 H0Z" fill="#d9a77a" fill-opacity=".10"/>

  <!-- coffee cup -->
  <g class="float">
