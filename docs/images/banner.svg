    <ellipse cx="240" cy="336" rx="128" ry="20" fill="#e2cdb6"/>
    <ellipse cx="240" cy="332" rx="92" ry="12" fill="#c9ad90" fill-opacity=".55"/>
    <path d="M328 214 C386 208 388 286 326 292" fill="none" stroke="#f3e6d6" stroke-width="15" stroke-linecap="round"/>
    <path d="M150 196 H330 V236 C330 292 294 328 240 328 C186 328 150 292 150 236 Z" fill="url(#cupG)"/>
    <g clip-path="url(#cupClip)">
      <rect x="140" y="250" width="200" height="30" fill="#0a6ed1"/>
      <text x="240" y="270" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="3" fill="#fff">CAFEFLOW</text>
    </g>
    <ellipse cx="240" cy="196" rx="90" ry="17" fill="#fffaf3"/>
    <ellipse cx="240" cy="198" rx="78" ry="12.5" fill="#6b3f26"/>
    <path d="M240 206 C232 200 224 197 226 192 C228 187 236 188 240 193 C244 188 252 187 254 192 C256 197 248 200 240 206Z" fill="#e6c6a3"/>
    <g class="steam" fill="none" stroke="#f5e6d3" stroke-width="7" stroke-linecap="round">
      <path d="M205 176 C190 154 220 140 205 116 S218 82 206 64"/>
      <path d="M240 172 C225 148 257 134 240 108 S254 72 241 52"/>
      <path d="M275 176 C260 154 290 140 275 116 S288 82 276 64"/>
    </g>
  </g>

  <!-- title block -->
  <g class="fu">
    <text x="420" y="190" font-size="104" font-weight="800" letter-spacing="-2" fill="url(#titleG)">CafeFlow</text>
    <text x="420" y="190" font-size="104" font-weight="800" letter-spacing="-2" fill="url(#shine)" fill-opacity=".55">CafeFlow</text>
  </g>
  <text class="fu" style="animation-delay:.15s" x="424" y="246" font-size="32" font-weight="700" fill="#f3e2cf">카페 프랜차이즈 통합 운영 관리 시스템</text>
  <text class="fu" style="animation-delay:.3s" x="426" y="288" font-size="18" fill="#c9b29a" letter-spacing=".5">SAP Fiori  ·  SAPUI5 1.120  ·  SAP Horizon  ·  SAP CODE 2기 POU1</text>
  <g class="fu" style="animation-delay:0.45s">
    <rect x="424" y="318" width="86" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <text x="467" y="341.5" text-anchor="middle" font-size="15" font-weight="600" fill="#f3e2cf">대시보드</text></g>
  <g class="fu" style="animation-delay:0.54s">
    <rect x="520" y="318" width="86" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <text x="563" y="341.5" text-anchor="middle" font-size="15" font-weight="600" fill="#f3e2cf">지점</text></g>
  <g class="fu" style="animation-delay:0.63s">
    <rect x="616" y="318" width="86" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <text x="659" y="341.5" text-anchor="middle" font-size="15" font-weight="600" fill="#f3e2cf">메뉴</text></g>
  <g class="fu" style="animation-delay:0.72s">
    <rect x="712" y="318" width="86" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <text x="755" y="341.5" text-anchor="middle" font-size="15" font-weight="600" fill="#f3e2cf">매출</text></g>
  <g class="fu" style="animation-delay:0.81s">
    <rect x="808" y="318" width="86" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <text x="851" y="341.5" text-anchor="middle" font-size="15" font-weight="600" fill="#f3e2cf">재고</text></g>
  <g class="fu" style="animation-delay:0.9s">
    <rect x="904" y="318" width="86" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <text x="947" y="341.5" text-anchor="middle" font-size="15" font-weight="600" fill="#f3e2cf">발주</text></g>

  <!-- floating KPI cards -->
  <g class="float f2" filter="url(#shadow)">
    <rect x="1010" y="52" width="222" height="146" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
    <text x="1030" y="82" font-size="14" fill="#cbb59d">총 매출 · 5일 누적</text>
    <text x="1030" y="112" font-size="24" font-weight="800" fill="#fff">₩29,713,100</text>
    <rect class="bar" style="animation-delay:0.6s" x="1030" y="145" width="12" height="39" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:0.67s" x="1048.6" y="147.6" width="12" height="36.4" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:0.74s" x="1067.2" y="158" width="12" height="26" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:0.81s" x="1085.8" y="163.2" width="12" height="20.8" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:0.88s" x="1104.4" y="158" width="12" height="26" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:0.95s" x="1123" y="147.6" width="12" height="36.4" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:1.02s" x="1141.6" y="147.6" width="12" height="36.4" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:1.09s" x="1160.2" y="147.6" width="12" height="36.4" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:1.16s" x="1178.8" y="168.4" width="12" height="15.6" rx="3" fill="#4ea3f2"/><rect class="bar" style="animation-delay:1.23s" x="1197.4" y="163.2" width="12" height="20.8" rx="3" fill="#4ea3f2"/>
  </g>
  <g class="float f3" filter="url(#shadow)">
    <rect x="1010" y="216" width="222" height="72" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
    <circle cx="1036" cy="252" r="6" fill="#f87171" class="pulse"/><circle cx="1036" cy="252" r="6" fill="#f87171"/>
    <text x="1054" y="247" font-size="15" font-weight="700" fill="#fff">재고 부족 알림</text>
    <text x="1054" y="270" font-size="13" fill="#cbb59d">36개 품목 · 발주 연동</text>
  </g>
  <g class="float" filter="url(#shadow)">
    <rect x="1010" y="306" width="222" height="70" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
    <text x="1030" y="334" font-size="14" fill="#cbb59d">운영 지점</text>
    <text x="1212" y="334" text-anchor="end" font-size="15" font-weight="800" fill="#fff">10 / 12</text>
    <rect x="1030" y="350" width="182" height="8" rx="4" fill="#fff" fill-opacity=".12"/>
    <rect class="fill" x="1030" y="350" width="151.667" height="8" rx="4" fill="#34d399"/>
  </g>
</g>
</svg>